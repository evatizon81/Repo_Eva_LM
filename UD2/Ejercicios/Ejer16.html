<!DOCTYPE html>

<body>
    <h1><b>Patatas Fritas</b></h1>
    <hr>
    <figure>
        <img src="patatas fritas.jpg" alt="Patatas fritas caseras" width="288" height="185">
    </figure>
    <figcaption>Patatas fritas caseras.</figcaption>
    
    <h1><b>Ingredientes</b></h1>
    <ul>
        <li>3 ó 4 patatas (300gr.)</li>
        <li>4 dientes de ajo.</li>
        <li>Aceite de oliva.</li>
        <li>Sal.</li>
        
    </ul>

    <h1><b>Elaboración (Pasos)</b></h1>

    <ol>
        <li>Calentar aceite en una sartén.</li>
        <li>Añadir las patatas cortadas, la sal y los ajos.</li>
        <li>Freir al gusto.</li>
        <li>Servir en plato.</li>
    </ol>




</body>
