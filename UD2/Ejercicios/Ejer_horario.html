<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario</title>
</head>
<body>
    
<table border="3" style="text-align: center;">
    <caption> Horario</caption>
<thead>

    <tr>
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
    </tr>
</thead>
<tbody>
    <tr>
        <td>8:10  - 9:00</td>
        <td rowspan="2"  style="background-color:yellow;">BD</td>      
        <td rowspan="3" style="background-color: blue;">PR</td>   
        <td rowspan="2" style="background-color:red;">LM</td>
        <td></td>
        <td rowspan="3" style="background-color:yellow;">BD</td>
    </tr>

    <tr>
        <td>9:00  - 9:50</td>
        <td rowspan="2" style="background-color: blueviolet;">SI</td>
    </tr>

    <tr>
        <td>9:50  - 10:40</td>
        <td rowspan="2" style="background-color: blueviolet;">SI</td>
        <td rowspan="2"></td>     
    </tr>

    <tr>
        <td>10:40  -  11:30</td>
        <td style="background-color: blueviolet;">SI</td>
        <td colspan="2"></td>
    </tr>

    <tr>
        <td>11:30  -  12:00</td>
       <td colspan="5" style="background-color: aquamarine;">DESCANSO</td>
        
    </tr>

    <tr>
        <td>12:00  -  12:50</td>
        <td rowspan="3" style="background-color: blue;">PR</td>

        <td style="background-color: blueviolet;">SI</td>
        <td rowspan="3" style="background-color: cadetblue;">CD</td>
        <td rowspan="2" style="background-color:yellow;">BD</td>
        <td rowspan="3" style="background-color: blue;">PR</td>
    </tr>

    <tr>
        <td>12:50  -  13:40</td>
        <td rowspan="2" style="background-color:red;">LM</td>
    </tr>

    <tr>
        <td>13:40  -  14:30</td>
        <td colspan="1"></td>
    </tr>
    </tbody>

    <tfoot>1º DAM</tfoot>








</table>




</body>
</html>
