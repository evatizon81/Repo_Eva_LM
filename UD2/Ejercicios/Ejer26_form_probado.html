<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    
    <form action="validacion" method="get"></form>
        <label>Vamos a probar diferentes valores de type de HTML5 para la etiqueta input</label>
        <br><br>

    <fieldset >

        <legend>Para datos personales</legend>

        <label for="formulario">Telefonos</label>
        <input type="number" id="formularios" name="telefonos" placeholder= "9 números" ><br>
        <label for="formulario">correo electrónico</label>
        <input type="texto" id="formularios" name="correo electrónico" placeholder="El formato correcto es nombre+@+servidor de correo">

    </fieldset>


    <fieldset>       
    
        <legend>Para valores numéricos</legend>
        <label for="formulario">Número de personas</label>
        <input type="number" id="formularios" name="número de personas" value="1">

    </fieldset>
   
        












    
</body>
