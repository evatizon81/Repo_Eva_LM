<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden estilos</title>
</head>
<body>
    <fieldset>
<main>
        <h1>Orden de preferencia de la aplicación de estilos</h1> <br> 
        <p style="color: blue;">En este documento, vamos a comprobar paso a paso cómo es el
           orden de preferencia de la aplicación de estilos.</p>

           <ol>
            <li style="color: red;">Estilo del Navegador</li>
            <li style="color:green;">Estilos definidos en un documento de estilos externo.</li>
            <li style="color: red;">Estilos definidos con la etiqueta style.</li>
            <li style="color:green;>Estilos definidos con el atributo style.</li>

           </ol>
</main>

    </fieldset>

</body>

<footer>Los estilos de estilos.css  y de la etiqueta <style> del archivo no tienen efecto
    en los <li> impares porque se ha definido un estilo color en el atributo style del 
    elemento.</footer> 
       


</html>
